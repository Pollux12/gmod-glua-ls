[package]
name = "determinism"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
glua_code_analysis.workspace = true
glua_parser.workspace = true

tokio-util.workspace = true
lsp_types.workspace = true
mimalloc.workspace = true
# Allocation sampling (DET_ALLOC_SAMPLE): capture raw frame addresses cheaply
# during the run and resolve them only when reporting. Resolving per sample is
# orders of magnitude slower — slow enough to never finish a full run.
backtrace = "0.3"

[[bin]]
name = "determinism"
path = "src/main.rs"
