    ".github/",
    "bors.toml",
    "rustfmt.toml",
]
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "GLuaLS fork of rowan, a library for generic lossless syntax trees"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Pollux12/gmod-glua-ls"

[lib]
